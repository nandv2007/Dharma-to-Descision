# ===================================================
# Render Blueprint Specification (render.yaml)
# Project: Dharma to Decisions
# Docs: https://render.com/docs/blueprint-spec
# ===================================================

services:
  # -------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------
  - type: web
    name: dharma-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./app/dharma_decisions.db

  # -------------------------------------------------
  # 2. React Vite Frontend Static Site
  # -------------------------------------------------
  - type: static
    name: dharma-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single-page application (SPA) rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Connects the frontend to the backend URL automatically
      - key: VITE_API_URL
        fromService:
          type: web
          name: dharma-backend
          property: host
